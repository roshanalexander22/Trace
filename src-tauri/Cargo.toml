[package]
name = "trace"
version.workspace = true
edition.workspace = true

[lib]
name = "trace_lib"
# Use rlib for lightweight desktop builds (add "staticlib", "cdylib" only if targeting Android/iOS)
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
trace-core = { path = "../crates/trace-core", features = ["specta"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
specta = { version = "=2.0.0-rc.28", features = ["derive", "function"] }
specta-typescript = "0.0.15"
tauri-specta = { version = "=2.0.0-rc.28", features = ["derive", "typescript"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
png = "0.17"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
